<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Альона — UI/UX-дизайнерка. Зрозумілі сайти для малого бізнесу</title>
    <meta
      name="description"
      content="Альона, UI/UX-дизайнерка. Роблю зрозумілі сайти для малого бізнесу: від першої розмови до готового макета у Figma."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="logo" href="/" aria-label="AZ.design — на головну">
          <b>AZ.</b>design / UI·UX
        </a>
        <nav class="nav" aria-label="Головне меню">
          <a href="#services">Послуги</a>
          <a href="#about">Про мене</a>
          <a href="#works">Роботи</a>
          <a href="#contacts">Контакти</a>
        </nav>
        <a class="btn btn--small" href="#contacts">Написати</a>
      </div>
    </header>

    <main>
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero__canvas">
          <img
            class="hero__collage"
            src="/images/hero-collage.png"
            alt=""
            aria-hidden="true"
          />
          <img
            class="hero__portrait"
            src="/images/hero-portrait.png"
            alt="Альона, UI/UX-дизайнерка"
          />

          <div class="hero__content">
            <h1 id="hero-title" class="hero__title">
              Допоможу зробити простий і&nbsp;зручний сайт для вашого&nbsp;бізнесу
            </h1>
            <p class="hero__subtitle">
              Від першої розмови до готового макета у Figma.<br />
              Допомагаю власникам бізнесу, майстрам і студіям.
            </p>
            <div class="hero__actions">
              <a class="btn btn--large btn--accent" href="#contacts">Обговорити проєкт</a>
              <a class="btn btn--large" href="#works">Дивитися роботи</a>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
